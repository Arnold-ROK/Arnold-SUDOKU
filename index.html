<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>RYK SUDOKU</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#12203C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RYK SUDOKU" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./icon-192.png" />
<style>
  :root{
    --ink:#12203C; --panel:#1B2C4F; --line:#2E4270; --paper:#EFEDE4;
    --peer:#E1DECF; --same:#E9E2C8; --sel:#F6D98F; --given:#1A2438;
    --entry:#1F5FA8; --bad:#B23B2E; --hint:#7B57A8; --done:#BEDCB4;
    --doneSame:#A9CF9D; --amber:#E8A93A; --dim:#8FA0C2;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK KR',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink);min-height:100%}
  body{
    font-family:var(--sans); color:var(--paper);
    padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));
    display:flex; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  #app{width:100%;max-width:430px}
  .topBar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
  .langWrap{position:relative;display:flex;align-items:center;min-width:0;
    border:1px solid var(--line);border-radius:4px;color:var(--dim)}
  .langWrap .globe{position:absolute;left:9px;font-size:13px;pointer-events:none}
  .langWrap .caret{position:absolute;right:9px;font-size:9px;pointer-events:none}
  #langSel{appearance:none;-webkit-appearance:none;background:transparent;border:none;color:var(--paper);
    font-family:var(--sans);font-size:12.5px;padding:8px 24px 8px 29px;min-height:34px;cursor:pointer;border-radius:4px}
  #langSel option{color:#1A2438;background:#fff}
  #helpBtn{padding:8px 12px;min-height:34px;border-radius:4px;background:transparent;
    border:1px solid var(--line);color:var(--paper);font-size:12.5px;white-space:nowrap}
  h1{
    font-family:var(--serif); font-size:28px; letter-spacing:.16em;
    font-weight:400; margin:0; text-align:center; color:var(--paper);
  }
  .rule{display:flex;justify-content:center;gap:4px;margin:10px 0 18px}
  .rule i{width:18px;height:2px;background:var(--line);display:block}
  .rule i.on{background:var(--amber)}

  .row{display:flex;gap:8px}
  button{font-family:var(--sans);cursor:pointer}
  .diff{
    flex:1;padding:9px 0;font-size:13px;border-radius:4px;
    border:1px solid var(--line);background:transparent;color:var(--dim);
  }
  .diff.on{background:var(--amber);border-color:var(--amber);color:var(--given);font-weight:600}

  .bar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border-radius:4px;padding:10px 14px;margin:12px 0;
  }
  .bar .lbl{color:var(--dim);font-size:13px}
  #clock{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.05em}
  #pause{
    padding:6px 12px;font-size:12px;border-radius:4px;
    border:1px solid var(--line);background:transparent;color:var(--amber);
  }

  #boardWrap{position:relative;width:100%;aspect-ratio:1/1;border:2px solid var(--given);background:var(--paper)}
  #board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;height:100%}
  .cell{
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--entry);font-size:clamp(17px,5vw,22px);font-weight:500;
    border-right:.5px solid var(--given);border-bottom:.5px solid var(--given);
    font-variant-numeric:tabular-nums;transition:background 260ms ease;
    padding:0;line-height:1;
  }
  .cell.br{border-right-width:2px}
  .cell.bb{border-bottom-width:2px}
  .cell.edge-r{border-right-width:0}
  .cell.edge-b{border-bottom-width:0}
  .cell.given{color:var(--given);font-weight:600}
  .cell.hint{color:var(--hint);font-weight:600}
  .cell.bad{color:var(--bad)}
  .cell.peer{background:var(--peer)}
  .cell.samev{background:var(--same)}
  .cell.done{background:var(--done)}
  .cell.done.samev{background:var(--doneSame)}
  .cell.sel{background:var(--sel)}
  .notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;
    font-size:clamp(10px,3.1vw,13px);color:#4E5668;font-weight:500;line-height:1}
  .notes span{display:flex;align-items:center;justify-content:center}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;
  }
  #pauseCover{background:var(--ink)}
  #winCover{background:rgba(18,32,60,.94)}
  #loadCover{background:var(--paper);color:var(--given);font-size:14px}
  .cta{padding:9px 20px;border:none;border-radius:4px;background:var(--amber);
    color:var(--given);font-size:14px;font-weight:600}
  #winNote{color:var(--amber);font-size:13px;letter-spacing:.06em}
  #winTime{font-family:var(--serif);font-size:34px;font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  #pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:12px}
  #pad button{
    padding:14px 0;border-radius:4px;background:var(--panel);border:1px solid var(--line);
    color:var(--paper);font-size:17px;font-variant-numeric:tabular-nums;
  }
  #pad button.used{color:var(--line)}

  #tools{display:flex;gap:8px;margin-top:8px}
  #tools button{
    flex:1 1 0;min-width:0;padding:8px 2px;border-radius:4px;background:transparent;
    border:1px solid var(--line);color:var(--dim);font-size:12px;line-height:1.25;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  #tools .ic{font-size:15px;line-height:1}
  #tools .tx{overflow-wrap:anywhere}
  #tools button.on{background:var(--amber);border-color:var(--amber);color:var(--given);font-weight:600}

  .statusRow{display:flex;align-items:center;gap:8px;margin-top:8px}
  #status{flex:1;font-size:12px;color:var(--amber);min-height:16px}
  #newGame{padding:8px 16px;border-radius:4px;background:transparent;
    border:1px solid var(--line);color:var(--dim);font-size:12.5px}

  #records{margin-top:26px}
  .recHead{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;
    padding-bottom:6px;border-bottom:1px solid var(--line)}
  .recHead b{color:var(--paper);font-weight:500}
  .recCols,.recRow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr}
  .recCols{color:var(--dim);font-size:11px;padding:8px 0 2px}
  .recRow{font-size:13px;padding:7px 0;border-top:1px solid var(--panel);
    color:var(--paper);font-variant-numeric:tabular-nums}
  .recCols span:not(:first-child),.recRow span:not(:first-child){text-align:right}
  .recRow.cur span:first-child{color:var(--amber)}
  #reset{margin-top:16px;width:100%;padding:9px 0;border-radius:4px;background:transparent;
    border:1px solid var(--panel);color:var(--dim);font-size:11.5px}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

  body.noscroll{overflow:hidden}
  #helpModal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
    background:rgba(7,13,27,.72)}
  #helpPanel{width:100%;max-width:430px;max-height:100%;display:flex;flex-direction:column;
    background:var(--ink);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .helpHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;border-bottom:1px solid var(--line)}
  #helpTitle{margin:0;font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:0;color:var(--paper)}
  #helpClose{padding:7px 12px;min-height:32px;border:none;border-radius:4px;background:var(--amber);
    color:var(--given);font-size:12.5px;font-weight:600;white-space:nowrap}
  #helpBody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:2px 16px 18px;font-size:13.5px;line-height:1.6;color:var(--paper);
    -webkit-user-select:text;user-select:text}
  #helpBody h3{margin:18px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--amber)}
  #helpBody p{margin:0 0 8px}
  #helpBody dl{margin:0}
  #helpBody dt{margin-top:9px;font-weight:600}
  #helpBody dd{margin:1px 0 0;color:#C9D2E4}
</style>
</head>
<body>
<div id="app">
  <div class="topBar">
    <label class="langWrap">
      <span class="globe" aria-hidden="true">🌐</span>
      <select id="langSel"></select>
      <span class="caret" aria-hidden="true">▼</span>
    </label>
    <button id="helpBtn" type="button"></button>
  </div>
  <h1>RYK SUDOKU</h1>
  <div class="rule">
    <i></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i>
  </div>

  <div class="row" id="diffs"></div>

  <div class="bar">
    <span class="lbl" id="diffLabel"></span>
    <span id="clock">00:00</span>
    <button id="pause"></button>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div class="overlay hidden" id="pauseCover">
      <span style="font-size:15px" id="pausedText"></span>
      <button class="cta" id="resume"></button>
    </div>
    <div class="overlay hidden" id="winCover">
      <span id="winNote"></span>
      <span id="winTime">00:00</span>
      <button class="cta" id="again"></button>
    </div>
    <div class="overlay hidden" id="loadCover"></div>
  </div>

  <div id="pad"></div>

  <div id="tools">
    <button id="noteBtn"><span class="ic" aria-hidden="true">✎</span><span class="tx"></span></button>
    <button id="hintBtn"><span class="ic" aria-hidden="true">💡</span><span class="tx"></span></button>
    <button id="undoBtn"><span class="ic" aria-hidden="true">↺</span><span class="tx"></span></button>
    <button id="eraseBtn"><span class="ic" aria-hidden="true">⌫</span><span class="tx"></span></button>
  </div>

  <div class="statusRow">
    <span id="status"></span>
    <button id="newGame"></button>
  </div>

  <div id="records">
    <div class="recHead"><span id="recTitle"></span><span id="recTotal"></span></div>
    <div class="recCols"><span id="colDiff"></span><span id="colSolved"></span><span id="colBest"></span><span id="colWorst"></span></div>
    <div id="recRows"></div>
    <button id="reset"></button>
  </div>
</div>

<canvas id="fx" class="hidden" aria-hidden="true"></canvas>

<div id="helpModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div id="helpPanel">
    <div class="helpHead">
      <h2 id="helpTitle"></h2>
      <button id="helpClose" type="button"></button>
    </div>
    <div id="helpBody"></div>
  </div>
</div>

const LANG_KEY = 'ryk-sudoku:lang';
function detectLang(){
  try{ const saved=localStorage.getItem(LANG_KEY); if(saved&&I18N[saved]) return saved; }catch(e){}
  const prefs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(const p of prefs){
    const base=String(p).toLowerCase().split('-')[0];
    if(I18N[base]) return base;
  }
  return 'en';
}
let lang = detectLang();
function t(key,params){
  let s = I18N[lang][key];
  if(s===undefined) s = I18N.en[key];
  if(params) Object.keys(params).forEach(k=>{ s=s.split('{'+k+'}').join(params[k]); });
  return s;
}

/* ---------------- fireworks ---------------- */
const FX = (()=>{
  const cv=document.getElementById('fx');
  const COLORS=['#FF4D5E','#FFB627','#FFE66D','#3DDC84','#38BDF8','#6C8CFF','#C77DFF','#FF7AC6'];
  const R=Math.random, TAU=Math.PI*2, MAX_PARTS=1100;
  let ctx=null, raf=0, parts=[], shells=[], w=0, h=0, last=0, elapsed=0, nextLaunch=0, launchUntil=0, still=false;
  const pick=()=>COLORS[Math.floor(R()*COLORS.length)];
  function size(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    w=window.innerWidth; h=window.innerHeight;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function launch(){
    shells.push({x:w*(.14+.72*R()), y:h+6, vx:(R()-.5)*50, vy:-Math.max(560,h*1.05),
      top:h*(.1+.42*R()), c:pick()});
  }
  function burst(x,y,c1){
    const c2=pick(), n=70+Math.floor(R()*34), power=Math.min(w,h)*(.5+.22*R());
    for(let i=0;i<n&&parts.length<MAX_PARTS;i++){
      const a=TAU*i/n+R()*.08, sp=power*(.32+.68*R());
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,max:.85+R()*.55,
        c:i%4===0?c2:c1,r:1.3+R()*1.5,g:210,drag:2.1});
    }
  }
  function stillBurst(x,y,c1){
    const n=26, rad=Math.min(w,h)*.13;
    for(let i=0;i<n;i++){
      const a=TAU*i/n, d=rad*(i%2?1:.62);
      parts.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,vx:0,vy:0,age:0,max:1.6,c:c1,r:2.4,g:0,drag:0});
    }
  }
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000||0); last=now; elapsed+=dt;
    if(!still&&elapsed<launchUntil&&elapsed>=nextLaunch){ launch(); nextLaunch=elapsed+.16+R()*.2; }
    ctx.globalCompositeOperation='source-over';
    if(still) ctx.clearRect(0,0,w,h);
    else{
      ctx.globalCompositeOperation='destination-out';
      ctx.fillStyle='rgba(0,0,0,.24)'; ctx.fillRect(0,0,w,h);
    }
    ctx.globalCompositeOperation=still?'source-over':'lighter';
    shells=shells.filter(s=>{
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=240*dt;
      ctx.globalAlpha=.95; ctx.fillStyle=s.c;
      ctx.beginPath(); ctx.arc(s.x,s.y,2.2,0,TAU); ctx.fill();
      if(s.y<=s.top||s.vy>=-70){ burst(s.x,s.y,s.c); return false; }
      return true;
    });
    parts=parts.filter(p=>{
      p.age+=dt; if(p.age>=p.max) return false;
      const k=Math.max(0,1-p.drag*dt);
      p.vx*=k; p.vy=p.vy*k+p.g*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      const f=p.age/p.max;
      ctx.globalAlpha=Math.max(0,1-f*f);
      ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
      return true;
    });
    ctx.globalAlpha=1;
    if(parts.length||shells.length||(!still&&elapsed<launchUntil)) raf=requestAnimationFrame(frame);
    else stop();
  }
  function stop(){
    if(raf) cancelAnimationFrame(raf);
    raf=0; parts=[]; shells=[];
    if(ctx) ctx.clearRect(0,0,w,h);
    window.removeEventListener('resize',size);
    cv.classList.add('hidden');
  }
  function start(){
    stop();
    cv.classList.remove('hidden');
    size();
    window.addEventListener('resize',size);
    still=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    elapsed=0; last=performance.now();
    if(still){
      stillBurst(w*.28,h*.26,COLORS[0]);
      stillBurst(w*.72,h*.2,COLORS[4]);
      stillBurst(w*.5,h*.72,COLORS[1]);
      launchUntil=0;
    }else{
      launchUntil=2.9; nextLaunch=.34;
      launch(); launch(); launch();
    }
    raf=requestAnimationFrame(frame);
  }
  return {start,stop};
})();

/* ---------------- constants ---------------- */
const DIFFS = [
  {key:'easy',   clues:45},
  {key:'medium', clues:36},
  {key:'hard',   clues:30},
  {key:'expert', clues:26},
];
const STATS_KEY = 'ryk-sudoku:stats';
const GAME_KEY  = 'ryk-sudoku:game';

/* ---------------- engine ---------------- */
const rowOf = i => Math.floor(i/9), colOf = i => i%9;
const boxOf = i => Math.floor(rowOf(i)/3)*3 + Math.floor(colOf(i)/3);

function canPlace(b,i,v){
  const r=rowOf(i), c=colOf(i), bx=boxOf(i);
  for(let k=0;k<81;k++){
    if(k===i||b[k]!==v) continue;
    if(rowOf(k)===r||colOf(k)===c||boxOf(k)===bx) return false;
  }
  return true;
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeSolution(){
  const b=new Array(81).fill(0);
  (function fill(i){
    if(i===81) return true;
    for(const v of shuffled([1,2,3,4,5,6,7,8,9])){
      if(canPlace(b,i,v)){ b[i]=v; if(fill(i+1)) return true; b[i]=0; }
    }
    return false;
  })(0);
  return b;
}
function countSolutions(b,limit){
  let best=-1,fewest=10;
  for(let i=0;i<81;i++){
    if(b[i]!==0) continue;
    let n=0; for(let v=1;v<=9;v++) if(canPlace(b,i,v)) n++;
    if(n===0) return 0;
    if(n<fewest){fewest=n;best=i;if(n===1)break;}
  }
  if(best===-1) return 1;
  let total=0;
  for(let v=1;v<=9;v++){
    if(!canPlace(b,best,v)) continue;
    b[best]=v; total+=countSolutions(b,limit-total); b[best]=0;
    if(total>=limit) return total;
  }
  return total;
}
function carve(sol,target){
  const b=sol.slice(); let clues=81;
  for(const i of shuffled([...Array(41).keys()])){
    if(clues<=target) break;
    const j=80-i, a=b[i], d=b[j];
    if(a===0&&d===0) continue;
    b[i]=0;b[j]=0;
    if(countSolutions(b.slice(),2)!==1){b[i]=a;b[j]=d;}
    else clues -= (i===j?1:2);
  }
  return b;
}

/* ---------------- state ---------------- */
let S = {
  diff:'easy', puzzle:[], solution:[], board:[], notes:[], revealed:[],
  sel:null, noteMode:false, history:[], elapsed:0, paused:false, solved:false, loading:true,
  helpOpen:false, win:null
};
let stats = loadStats();
let timerId = null;

function emptyStats(){
  const o={}; DIFFS.forEach(d=>o[d.key]={solved:0,best:null,worst:null}); return o;
}
function loadStats(){
  try{ const raw=localStorage.getItem(STATS_KEY); return raw?Object.assign(emptyStats(),JSON.parse(raw)):emptyStats(); }
  catch(e){ return emptyStats(); }
}
function saveStats(){ try{ localStorage.setItem(STATS_KEY,JSON.stringify(stats)); }catch(e){} }
function saveGame(){
  if(S.loading) return;
  try{
    localStorage.setItem(GAME_KEY, JSON.stringify({
      diff:S.diff,puzzle:S.puzzle,solution:S.solution,board:S.board,
      notes:S.notes,revealed:S.revealed,elapsed:S.elapsed,solved:S.solved
    }));
  }catch(e){}
}
function restoreGame(){
  try{
    const raw=localStorage.getItem(GAME_KEY); if(!raw) return false;
    const g=JSON.parse(raw);
    if(!g||!g.puzzle||g.puzzle.length!==81||g.solved) return false;
    S.diff=g.diff; S.puzzle=g.puzzle; S.solution=g.solution; S.board=g.board;
    S.notes=g.notes; S.revealed=g.revealed||[]; S.elapsed=g.elapsed||0;
    S.solved=false; S.loading=false; S.sel=null; S.history=[];
    return true;
  }catch(e){ return false; }
}

/* ---------------- helpers ---------------- */
function fmt(s){
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h>0?`${h}:${p(m)}:${p(sec)}`:`${p(m)}:${p(sec)}`;
}
function conflictSet(){
  const bad=new Set();
  for(let i=0;i<81;i++){
    const v=S.board[i]; if(!v) continue;
    for(let k=i+1;k<81;k++){
      if(S.board[k]!==v) continue;
      if(rowOf(k)===rowOf(i)||colOf(k)===colOf(i)||boxOf(k)===boxOf(i)){bad.add(i);bad.add(k);}
    }
  }
  return bad;
}
function doneSet(){
  const done=new Set(); if(S.board.length!==81) return done;
  const nine=[0,1,2,3,4,5,6,7,8];
  const mark=idx=>{
    const vals=idx.map(i=>S.board[i]);
    if(vals.some(v=>!v)) return;
    if(new Set(vals).size===9) idx.forEach(i=>done.add(i));
  };
  nine.forEach(r=>mark(nine.map(c=>r*9+c)));
  nine.forEach(c=>mark(nine.map(r=>r*9+c)));
  nine.forEach(b=>mark(nine.map(k=>{
    const r=Math.floor(b/3)*3+Math.floor(k/3), c=(b%3)*3+(k%3); return r*9+c;
  })));
  return done;
}
let statusMsg=null;
function paintStatus(){
  document.getElementById('status').textContent =
    statusMsg ? t(statusMsg.key,statusMsg.params) : (S.noteMode ? t('noteMode') : '');
}
function say(key,params){
  statusMsg={key,params};
  paintStatus();
  clearTimeout(say._t);
  say._t=setTimeout(()=>{ statusMsg=null; paintStatus(); },2400);
}

/* ---------------- build DOM ---------------- */
const boardEl=document.getElementById('board');
const cells=[];
for(let i=0;i<81;i++){
  const el=document.createElement('button');
  el.className='cell';
  if(colOf(i)%3===2) el.classList.add('br');
  if(rowOf(i)%3===2) el.classList.add('bb');
  if(colOf(i)===8) el.classList.add('edge-r');
  if(rowOf(i)===8) el.classList.add('edge-b');
  el.addEventListener('click',()=>{ S.sel=i; render(); });
  boardEl.appendChild(el); cells.push(el);
}
const diffsEl=document.getElementById('diffs');
DIFFS.forEach(d=>{
  const b=document.createElement('button');
  b.className='diff'; b.dataset.key=d.key;
  b.addEventListener('click',()=>newGame(d.key));
  diffsEl.appendChild(b);
});
const padEl=document.getElementById('pad');
for(let n=1;n<=9;n++){
  const b=document.createElement('button');
  b.textContent=n; b.dataset.n=n;
  b.addEventListener('click',()=>place(n));
  padEl.appendChild(b);
}

/* ---------------- game actions ---------------- */
function newGame(key){
  FX.stop();
  S.diff=key; S.loading=true; S.solved=false; S.win=null; render();
  setTimeout(()=>{
    const sol=makeSolution();
    const puz=carve(sol,DIFFS.find(d=>d.key===key).clues);
    S.solution=sol; S.puzzle=puz; S.board=puz.slice();
    S.notes=Array.from({length:81},()=>[]); S.revealed=[]; S.history=[];
    S.sel=null; S.elapsed=0; S.paused=false; S.solved=false; S.noteMode=false;
    S.loading=false;
    statusMsg=null;
    saveGame(); render();
  },30);
}
function place(v){
  if(S.sel===null||S.solved||S.paused||S.loading) return;
  const i=S.sel;
  if(S.puzzle[i]!==0||S.revealed.includes(i)) return;
  S.history.push({i,val:S.board[i],note:S.notes[i].slice()});
  if(S.noteMode&&v!==0){
    S.notes[i]=S.notes[i].includes(v)?S.notes[i].filter(x=>x!==v):[...S.notes[i],v].sort();
    S.board[i]=0;
  }else{
    S.notes[i]=[];
    S.board[i]=(S.board[i]===v)?0:v;
  }
  checkWin(); saveGame(); render();
}
function hint(){
  if(S.loading||S.solved||S.paused) return;
  const i=S.sel;
  if(i===null){ say('pickCell'); return; }
  if(S.puzzle[i]!==0){ say('givenCell'); return; }
  if(S.revealed.includes(i)){ say('hintSeen'); return; }
  if(S.board[i]!==0){ say('hasNumber'); return; }
  S.revealed.push(i); S.notes[i]=[]; S.board[i]=S.solution[i];
  say('hintValue',{n:S.board[i]});
  checkWin(); saveGame(); render();
}
function undo(){
  if(S.solved||S.paused||S.loading) return;
  while(S.history.length){
    const last=S.history.pop();
    if(S.revealed.includes(last.i)) continue;
    S.board[last.i]=last.val; S.notes[last.i]=last.note; S.sel=last.i; break;
  }
  saveGame(); render();
}
function checkWin(){
  if(S.board.length!==81) return;
  for(let i=0;i<81;i++) if(S.board[i]!==S.solution[i]) return;
  S.solved=true;
  const cur=stats[S.diff]||{solved:0,best:null,worst:null};
  const clean=S.revealed.length===0;
  const isBest=clean&&(cur.best===null||S.elapsed<cur.best);
  stats[S.diff]={
    solved:cur.solved+1,
    best:isBest?S.elapsed:cur.best,
    worst:(clean&&(cur.worst===null||S.elapsed>cur.worst))?S.elapsed:cur.worst
  };
  saveStats();
  try{ localStorage.removeItem(GAME_KEY); }catch(e){}
  S.win = !clean ? {key:'winHint',params:{n:S.revealed.length}}
                 : {key:(isBest&&cur.solved>0)?'winBest':'win'};
  document.getElementById('winTime').textContent=fmt(S.elapsed);
  FX.start();
}

/* ---------------- render ---------------- */
function render(){
  document.querySelectorAll('.diff').forEach(b=>b.classList.toggle('on',b.dataset.key===S.diff));
  document.getElementById('diffLabel').textContent=t(S.diff);
  document.getElementById('clock').textContent=fmt(S.elapsed);
  document.getElementById('pause').textContent=t(S.paused?'resumeShort':'pause');
  document.getElementById('noteBtn').classList.toggle('on',S.noteMode);
  document.querySelector('#hintBtn .tx').textContent=t('hintBtn')+(S.revealed.length?' '+S.revealed.length:'');
  document.getElementById('winNote').textContent=S.win?t(S.win.key,S.win.params):'';
  paintStatus();

  document.getElementById('loadCover').classList.toggle('hidden',!S.loading);
  document.getElementById('pauseCover').classList.toggle('hidden',!(S.paused&&!S.solved&&!S.loading));
  document.getElementById('winCover').classList.toggle('hidden',!S.solved);

  const bad=conflictSet(), done=doneSet();
  const selV=(S.sel!==null)?S.board[S.sel]:0;
  for(let i=0;i<81;i++){
    const el=cells[i], v=S.board[i]||0;
    el.className='cell'
      +(colOf(i)%3===2?' br':'')+(rowOf(i)%3===2?' bb':'')
      +(colOf(i)===8?' edge-r':'')+(rowOf(i)===8?' edge-b':'');
    if(S.puzzle[i]) el.classList.add('given');
    if(S.revealed.includes(i)) el.classList.add('hint');
    if(bad.has(i)) el.classList.add('bad');
    if(done.has(i)) el.classList.add('done');
    if(S.sel!==null){
      const peer=rowOf(S.sel)===rowOf(i)||colOf(S.sel)===colOf(i)||boxOf(S.sel)===boxOf(i);
      if(peer&&!done.has(i)) el.classList.add('peer');
      if(selV&&v===selV) el.classList.add('samev');
      if(S.sel===i) el.classList.add('sel');
    }
    if(v){ el.textContent=v; }
    else if(S.notes[i]&&S.notes[i].length){
      el.innerHTML='<span class="notes">'+
        [1,2,3,4,5,6,7,8,9].map(n=>`<span>${S.notes[i].includes(n)?n:''}</span>`).join('')+
        '</span>';
    } else el.textContent='';
  }
  for(let n=1;n<=9;n++){
    const cnt=S.board.filter(x=>x===n).length;
    padEl.querySelector(`[data-n="${n}"]`).classList.toggle('used',cnt>=9);
  }
  renderRecords();
}
function renderRecords(){
  const rows=document.getElementById('recRows');
  rows.innerHTML='';
  let total=0;
  DIFFS.forEach(d=>{
    const s=stats[d.key]||{solved:0,best:null,worst:null};
    total+=s.solved;
    const div=document.createElement('div');
    div.className='recRow'+(d.key===S.diff?' cur':'');
    div.innerHTML=`<span>${t(d.key)}</span><span>${s.solved}</span>`+
      `<span>${s.best===null?'–':fmt(s.best)}</span><span>${s.worst===null?'–':fmt(s.worst)}</span>`;
    rows.appendChild(div);
  });
  const totalEl=document.getElementById('recTotal');
  totalEl.textContent='';
  t('total').split('{n}').forEach((part,idx)=>{
    if(idx>0){ const b=document.createElement('b'); b.textContent=total; totalEl.appendChild(b); }
    totalEl.appendChild(document.createTextNode(part));
  });
}

/* ---------------- language + help ---------------- */
const langSel=document.getElementById('langSel');
LANGS.forEach(l=>{
  const o=document.createElement('option');
  o.value=l.code; o.textContent=l.name; langSel.appendChild(o);
});
function renderHelp(){
  const body=document.getElementById('helpBody');
  body.textContent='';
  t('helpDoc').forEach(sec=>{
    const h=document.createElement('h3'); h.textContent=sec.h; body.appendChild(h);
    if(sec.p){ const p=document.createElement('p'); p.textContent=sec.p; body.appendChild(p); }
    if(sec.items){
      const dl=document.createElement('dl');
      sec.items.forEach(([lead,text])=>{
        const dt=document.createElement('dt'); dt.textContent=lead;
        const dd=document.createElement('dd'); dd.textContent=text;
        dl.append(dt,dd);
      });
      body.appendChild(dl);
    }
  });
}
function applyLang(){
  const meta=LANGS.find(l=>l.code===lang);
  document.documentElement.lang=meta.html;
  langSel.value=lang;
  langSel.setAttribute('aria-label',t('language'));
  const set=(id,key)=>{ document.getElementById(id).textContent=t(key); };
  set('helpBtn','help'); set('helpTitle','help'); set('helpClose','close');
  set('pausedText','paused'); set('resume','resumeLong'); set('again','again');
  set('loadCover','loading'); set('newGame','newPuzzle'); set('recTitle','records');
  set('colDiff','colDiff'); set('colSolved','colSolved'); set('colBest','colBest'); set('colWorst','colWorst');
  set('reset','reset');
  document.querySelector('#noteBtn .tx').textContent=t('note');
  document.querySelector('#undoBtn .tx').textContent=t('undo');
  document.querySelector('#eraseBtn .tx').textContent=t('erase');
  document.querySelectorAll('.diff').forEach(b=>{ b.textContent=t(b.dataset.key); });
  renderHelp();
  render();
}
langSel.addEventListener('change',()=>{
  lang=langSel.value;
  try{ localStorage.setItem(LANG_KEY,lang); }catch(e){}
  applyLang();
});
const helpModal=document.getElementById('helpModal');
function openHelp(){
  S.helpOpen=true;
  helpModal.classList.remove('hidden');
  document.body.classList.add('noscroll');
  document.getElementById('helpBody').scrollTop=0;
  document.getElementById('helpClose').focus();
}
function closeHelp(){
  S.helpOpen=false;
  helpModal.classList.add('hidden');
  document.body.classList.remove('noscroll');
  document.getElementById('helpBtn').focus();
}
document.getElementById('helpBtn').addEventListener('click',openHelp);
document.getElementById('helpClose').addEventListener('click',closeHelp);
helpModal.addEventListener('click',e=>{ if(e.target===helpModal) closeHelp(); });

/* ---------------- timer ---------------- */
function tick(){
  if(S.loading||S.paused||S.solved||S.helpOpen) return;
  S.elapsed++;
  document.getElementById('clock').textContent=fmt(S.elapsed);
  if(S.elapsed%5===0) saveGame();
}
timerId=setInterval(tick,1000);

/* ---------------- events ---------------- */
document.getElementById('pause').addEventListener('click',()=>{
  if(S.solved||S.loading) return; S.paused=!S.paused; render();
});
document.getElementById('resume').addEventListener('click',()=>{ S.paused=false; render(); });
document.getElementById('again').addEventListener('click',()=>newGame(S.diff));
document.getElementById('newGame').addEventListener('click',()=>newGame(S.diff));
document.getElementById('hintBtn').addEventListener('click',hint);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('eraseBtn').addEventListener('click',()=>place(0));
document.getElementById('noteBtn').addEventListener('click',()=>{
  S.noteMode=!S.noteMode;
  statusMsg=null;
  render();
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm(t('resetConfirm'))){
    stats=emptyStats(); saveStats(); render();
  }
});
document.addEventListener('keydown',e=>{
  if(S.helpOpen){
    if(e.key==='Escape') closeHelp();
    else if(e.key==='Tab') e.preventDefault();
    return;
  }
  if(e.target===langSel||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key>='1'&&e.key<='9') place(Number(e.key));
  else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0') place(0);
  else if(e.key==='h'||e.key==='H') hint();
  else if(e.key==='n'||e.key==='N') document.getElementById('noteBtn').click();
  else if(S.sel!==null&&e.key.indexOf('Arrow')===0){
    const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
    const t=S.sel+d; if(t>=0&&t<81){ S.sel=t; render(); }
  }
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) return;
  if(!S.loading&&!S.solved&&!S.paused){ S.paused=true; render(); }
  saveGame();
});

/* ---------------- start ---------------- */
const restored=restoreGame();
applyLang();
if(!restored) newGame('easy');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
