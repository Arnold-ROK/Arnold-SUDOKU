<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>RYK SUDOKU</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#12203C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RYK SUDOKU" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./icon-192.png" />
<style>
  :root{
    --ink:#12203C; --panel:#1B2C4F; --line:#2E4270; --paper:#EFEDE4;
    --peer:#E1DECF; --same:#E9E2C8; --sel:#F6D98F; --given:#1A2438;
    --entry:#1F5FA8; --bad:#B23B2E; --hint:#7B57A8; --done:#BEDCB4;
    --doneSame:#A9CF9D; --amber:#E8A93A; --dim:#8FA0C2;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink);min-height:100%}
  body{
    font-family:var(--sans); color:var(--paper);
    padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));
    display:flex; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  #app{width:100%;max-width:430px}
  h1{
    font-family:var(--serif); font-size:28px; letter-spacing:.16em;
    font-weight:400; margin:0; text-align:center; color:var(--paper);
  }
  .rule{display:flex;justify-content:center;gap:4px;margin:10px 0 18px}
  .rule i{width:18px;height:2px;background:var(--line);display:block}
  .rule i.on{background:var(--amber)}

  .row{display:flex;gap:8px}
  button{font-family:var(--sans);cursor:pointer}
  .diff{
    flex:1;padding:9px 0;font-size:13px;border-radius:4px;
    border:1px solid var(--line);background:transparent;color:var(--dim);
  }
  .diff.on{background:var(--amber);border-color:var(--amber);color:var(--given);font-weight:600}

  .bar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border-radius:4px;padding:10px 14px;margin:12px 0;
  }
  .bar .lbl{color:var(--dim);font-size:13px}
  #clock{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.05em}
  #pause{
    padding:6px 12px;font-size:12px;border-radius:4px;
    border:1px solid var(--line);background:transparent;color:var(--amber);
  }

  #boardWrap{position:relative;width:100%;aspect-ratio:1/1;border:2px solid var(--given);background:var(--paper)}
  #board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;height:100%}
  .cell{
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--entry);font-size:1.15rem;font-weight:500;
    border-right:.5px solid var(--given);border-bottom:.5px solid var(--given);
    font-variant-numeric:tabular-nums;transition:background 260ms ease;
    padding:0;line-height:1;
  }
  .cell.br{border-right-width:2px}
  .cell.bb{border-bottom-width:2px}
  .cell.edge-r{border-right-width:0}
  .cell.edge-b{border-bottom-width:0}
  .cell.given{color:var(--given);font-weight:600}
  .cell.hint{color:var(--hint);font-weight:600}
  .cell.bad{color:var(--bad)}
  .cell.peer{background:var(--peer)}
  .cell.samev{background:var(--same)}
  .cell.done{background:var(--done)}
  .cell.done.samev{background:var(--doneSame)}
  .cell.sel{background:var(--sel)}
  .notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;
    font-size:8px;color:#6C7385;font-weight:400}
  .notes span{display:flex;align-items:center;justify-content:center}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;
  }
  #pauseCover{background:var(--ink)}
  #winCover{background:rgba(18,32,60,.94)}
  #loadCover{background:var(--paper);color:var(--given);font-size:14px}
  .cta{padding:9px 20px;border:none;border-radius:4px;background:var(--amber);
    color:var(--given);font-size:14px;font-weight:600}
  #winNote{color:var(--amber);font-size:13px;letter-spacing:.06em}
  #winTime{font-family:var(--serif);font-size:34px;font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  #pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:12px}
  #pad button{
    padding:14px 0;border-radius:4px;background:var(--panel);border:1px solid var(--line);
    color:var(--paper);font-size:17px;font-variant-numeric:tabular-nums;
  }
  #pad button.used{color:var(--line)}

  #tools{display:flex;gap:8px;margin-top:8px}
  #tools button{
    flex:1;padding:11px 0;border-radius:4px;background:transparent;
    border:1px solid var(--line);color:var(--dim);font-size:12.5px;
  }
  #tools button.on{background:var(--amber);border-color:var(--amber);color:var(--given);font-weight:600}

  .statusRow{display:flex;align-items:center;gap:8px;margin-top:8px}
  #status{flex:1;font-size:12px;color:var(--amber);min-height:16px}
  #newGame{padding:8px 16px;border-radius:4px;background:transparent;
    border:1px solid var(--line);color:var(--dim);font-size:12.5px}

  #records{margin-top:26px}
  .recHead{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;
    padding-bottom:6px;border-bottom:1px solid var(--line)}
  .recHead b{color:var(--paper);font-weight:500}
  .recCols,.recRow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr}
  .recCols{color:var(--dim);font-size:11px;padding:8px 0 2px}
  .recRow{font-size:13px;padding:7px 0;border-top:1px solid var(--panel);
    color:var(--paper);font-variant-numeric:tabular-nums}
  .recCols span:not(:first-child),.recRow span:not(:first-child){text-align:right}
  .recRow.cur span:first-child{color:var(--amber)}
  #reset{margin-top:16px;width:100%;padding:9px 0;border-radius:4px;background:transparent;
    border:1px solid var(--panel);color:var(--line);font-size:11.5px}
</style>
</head>
<body>
<div id="app">
  <h1>RYK SUDOKU</h1>
  <div class="rule">
    <i></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i>
  </div>

  <div class="row" id="diffs"></div>

  <div class="bar">
    <span class="lbl" id="diffLabel">쉬움</span>
    <span id="clock">00:00</span>
    <button id="pause">멈춤</button>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div class="overlay hidden" id="pauseCover">
      <span style="font-size:15px">시간이 멈췄습니다</span>
      <button class="cta" id="resume">이어서 풀기</button>
    </div>
    <div class="overlay hidden" id="winCover">
      <span id="winNote">완성</span>
      <span id="winTime">00:00</span>
      <button class="cta" id="again">한 판 더</button>
    </div>
    <div class="overlay hidden" id="loadCover">퍼즐 만드는 중</div>
  </div>

  <div id="pad"></div>

  <div id="tools">
    <button id="noteBtn">✎ 메모</button>
    <button id="hintBtn">💡 힌트</button>
    <button id="undoBtn">↺ 되돌리기</button>
    <button id="eraseBtn">⌫ 지우기</button>
  </div>

  <div class="statusRow">
    <span id="status"></span>
    <button id="newGame">새 퍼즐</button>
  </div>

  <div id="records">
    <div class="recHead"><span>기록</span><span>총 <b id="totalSolved">0</b>판</span></div>
    <div class="recCols"><span>난이도</span><span>푼 횟수</span><span>최단</span><span>최장</span></div>
    <div id="recRows"></div>
    <button id="reset">기록 전체 지우기</button>
  </div>
</div>

<script>
/* ---------------- constants ---------------- */
const DIFFS = [
  {key:'easy',   label:'쉬움',   clues:45},
  {key:'medium', label:'보통',   clues:36},
  {key:'hard',   label:'어려움', clues:30},
  {key:'expert', label:'전문가', clues:26},
];
const STATS_KEY = 'ryk-sudoku:stats';
const GAME_KEY  = 'ryk-sudoku:game';

/* ---------------- engine ---------------- */
const rowOf = i => Math.floor(i/9), colOf = i => i%9;
const boxOf = i => Math.floor(rowOf(i)/3)*3 + Math.floor(colOf(i)/3);

function canPlace(b,i,v){
  const r=rowOf(i), c=colOf(i), bx=boxOf(i);
  for(let k=0;k<81;k++){
    if(k===i||b[k]!==v) continue;
    if(rowOf(k)===r||colOf(k)===c||boxOf(k)===bx) return false;
  }
  return true;
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeSolution(){
  const b=new Array(81).fill(0);
  (function fill(i){
    if(i===81) return true;
    for(const v of shuffled([1,2,3,4,5,6,7,8,9])){
      if(canPlace(b,i,v)){ b[i]=v; if(fill(i+1)) return true; b[i]=0; }
    }
    return false;
  })(0);
  return b;
}
function countSolutions(b,limit){
  let best=-1,fewest=10;
  for(let i=0;i<81;i++){
    if(b[i]!==0) continue;
    let n=0; for(let v=1;v<=9;v++) if(canPlace(b,i,v)) n++;
    if(n===0) return 0;
    if(n<fewest){fewest=n;best=i;if(n===1)break;}
  }
  if(best===-1) return 1;
  let total=0;
  for(let v=1;v<=9;v++){
    if(!canPlace(b,best,v)) continue;
    b[best]=v; total+=countSolutions(b,limit-total); b[best]=0;
    if(total>=limit) return total;
  }
  return total;
}
function carve(sol,target){
  const b=sol.slice(); let clues=81;
  for(const i of shuffled([...Array(41).keys()])){
    if(clues<=target) break;
    const j=80-i, a=b[i], d=b[j];
    if(a===0&&d===0) continue;
    b[i]=0;b[j]=0;
    if(countSolutions(b.slice(),2)!==1){b[i]=a;b[j]=d;}
    else clues -= (i===j?1:2);
  }
  return b;
}

/* ---------------- state ---------------- */
let S = {
  diff:'easy', puzzle:[], solution:[], board:[], notes:[], revealed:[],
  sel:null, noteMode:false, history:[], elapsed:0, paused:false, solved:false, loading:true
};
let stats = loadStats();
let timerId = null;

function emptyStats(){
  const o={}; DIFFS.forEach(d=>o[d.key]={solved:0,best:null,worst:null}); return o;
}
function loadStats(){
  try{ const raw=localStorage.getItem(STATS_KEY); return raw?Object.assign(emptyStats(),JSON.parse(raw)):emptyStats(); }
  catch(e){ return emptyStats(); }
}
function saveStats(){ try{ localStorage.setItem(STATS_KEY,JSON.stringify(stats)); }catch(e){} }
function saveGame(){
  if(S.loading) return;
  try{
    localStorage.setItem(GAME_KEY, JSON.stringify({
      diff:S.diff,puzzle:S.puzzle,solution:S.solution,board:S.board,
      notes:S.notes,revealed:S.revealed,elapsed:S.elapsed,solved:S.solved
    }));
  }catch(e){}
}
function restoreGame(){
  try{
    const raw=localStorage.getItem(GAME_KEY); if(!raw) return false;
    const g=JSON.parse(raw);
    if(!g||!g.puzzle||g.puzzle.length!==81||g.solved) return false;
    S.diff=g.diff; S.puzzle=g.puzzle; S.solution=g.solution; S.board=g.board;
    S.notes=g.notes; S.revealed=g.revealed||[]; S.elapsed=g.elapsed||0;
    S.solved=false; S.loading=false; S.sel=null; S.history=[];
    return true;
  }catch(e){ return false; }
}

/* ---------------- helpers ---------------- */
function fmt(s){
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h>0?`${h}:${p(m)}:${p(sec)}`:`${p(m)}:${p(sec)}`;
}
function conflictSet(){
  const bad=new Set();
  for(let i=0;i<81;i++){
    const v=S.board[i]; if(!v) continue;
    for(let k=i+1;k<81;k++){
      if(S.board[k]!==v) continue;
      if(rowOf(k)===rowOf(i)||colOf(k)===colOf(i)||boxOf(k)===boxOf(i)){bad.add(i);bad.add(k);}
    }
  }
  return bad;
}
function doneSet(){
  const done=new Set(); if(S.board.length!==81) return done;
  const nine=[0,1,2,3,4,5,6,7,8];
  const mark=idx=>{
    const vals=idx.map(i=>S.board[i]);
    if(vals.some(v=>!v)) return;
    if(new Set(vals).size===9) idx.forEach(i=>done.add(i));
  };
  nine.forEach(r=>mark(nine.map(c=>r*9+c)));
  nine.forEach(c=>mark(nine.map(r=>r*9+c)));
  nine.forEach(b=>mark(nine.map(k=>{
    const r=Math.floor(b/3)*3+Math.floor(k/3), c=(b%3)*3+(k%3); return r*9+c;
  })));
  return done;
}
function say(msg){
  document.getElementById('status').textContent=msg;
  clearTimeout(say._t);
  say._t=setTimeout(()=>{ 
    document.getElementById('status').textContent = S.noteMode ? '메모 모드 — 숫자를 누르면 작게 적힙니다' : '';
  },2400);
}

/* ---------------- build DOM ---------------- */
const boardEl=document.getElementById('board');
const cells=[];
for(let i=0;i<81;i++){
  const el=document.createElement('button');
  el.className='cell';
  if(colOf(i)%3===2) el.classList.add('br');
  if(rowOf(i)%3===2) el.classList.add('bb');
  if(colOf(i)===8) el.classList.add('edge-r');
  if(rowOf(i)===8) el.classList.add('edge-b');
  el.addEventListener('click',()=>{ S.sel=i; render(); });
  boardEl.appendChild(el); cells.push(el);
}
const diffsEl=document.getElementById('diffs');
DIFFS.forEach(d=>{
  const b=document.createElement('button');
  b.className='diff'; b.textContent=d.label; b.dataset.key=d.key;
  b.addEventListener('click',()=>newGame(d.key));
  diffsEl.appendChild(b);
});
const padEl=document.getElementById('pad');
for(let n=1;n<=9;n++){
  const b=document.createElement('button');
  b.textContent=n; b.dataset.n=n;
  b.addEventListener('click',()=>place(n));
  padEl.appendChild(b);
}

/* ---------------- game actions ---------------- */
function newGame(key){
  S.diff=key; S.loading=true; render();
  setTimeout(()=>{
    const sol=makeSolution();
    const puz=carve(sol,DIFFS.find(d=>d.key===key).clues);
    S.solution=sol; S.puzzle=puz; S.board=puz.slice();
    S.notes=Array.from({length:81},()=>[]); S.revealed=[]; S.history=[];
    S.sel=null; S.elapsed=0; S.paused=false; S.solved=false; S.noteMode=false;
    S.loading=false;
    document.getElementById('status').textContent='';
    saveGame(); render();
  },30);
}
function place(v){
  if(S.sel===null||S.solved||S.paused||S.loading) return;
  const i=S.sel;
  if(S.puzzle[i]!==0||S.revealed.includes(i)) return;
  S.history.push({i,val:S.board[i],note:S.notes[i].slice()});
  if(S.noteMode&&v!==0){
    S.notes[i]=S.notes[i].includes(v)?S.notes[i].filter(x=>x!==v):[...S.notes[i],v].sort();
    S.board[i]=0;
  }else{
    S.notes[i]=[];
    S.board[i]=(S.board[i]===v)?0:v;
  }
  checkWin(); saveGame(); render();
}
function hint(){
  if(S.loading||S.solved||S.paused) return;
  const i=S.sel;
  if(i===null){ say('빈칸을 먼저 선택하세요'); return; }
  if(S.puzzle[i]!==0){ say('처음부터 주어진 칸입니다'); return; }
  if(S.revealed.includes(i)){ say('이미 힌트를 본 칸입니다'); return; }
  if(S.board[i]!==0){ say('숫자가 있는 칸입니다 — 지우고 눌러주세요'); return; }
  S.revealed.push(i); S.notes[i]=[]; S.board[i]=S.solution[i];
  say('힌트: '+S.board[i]);
  checkWin(); saveGame(); render();
}
function undo(){
  if(S.solved||S.paused||S.loading) return;
  while(S.history.length){
    const last=S.history.pop();
    if(S.revealed.includes(last.i)) continue;
    S.board[last.i]=last.val; S.notes[last.i]=last.note; S.sel=last.i; break;
  }
  saveGame(); render();
}
function checkWin(){
  if(S.board.length!==81) return;
  for(let i=0;i<81;i++) if(S.board[i]!==S.solution[i]) return;
  S.solved=true;
  const cur=stats[S.diff]||{solved:0,best:null,worst:null};
  const clean=S.revealed.length===0;
  const isBest=clean&&(cur.best===null||S.elapsed<cur.best);
  stats[S.diff]={
    solved:cur.solved+1,
    best:isBest?S.elapsed:cur.best,
    worst:(clean&&(cur.worst===null||S.elapsed>cur.worst))?S.elapsed:cur.worst
  };
  saveStats();
  try{ localStorage.removeItem(GAME_KEY); }catch(e){}
  document.getElementById('winNote').textContent =
    !clean ? `힌트 ${S.revealed.length}회 사용 — 시간 기록 제외`
           : (isBest&&cur.solved>0 ? '새 최단 기록' : '완성');
  document.getElementById('winTime').textContent=fmt(S.elapsed);
}

/* ---------------- render ---------------- */
function render(){
  document.querySelectorAll('.diff').forEach(b=>b.classList.toggle('on',b.dataset.key===S.diff));
  document.getElementById('diffLabel').textContent=DIFFS.find(d=>d.key===S.diff).label;
  document.getElementById('clock').textContent=fmt(S.elapsed);
  document.getElementById('pause').textContent=S.paused?'계속하기':'멈춤';
  document.getElementById('noteBtn').classList.toggle('on',S.noteMode);
  document.getElementById('hintBtn').textContent=S.revealed.length?`💡 힌트 ${S.revealed.length}`:'💡 힌트';

  document.getElementById('loadCover').classList.toggle('hidden',!S.loading);
  document.getElementById('pauseCover').classList.toggle('hidden',!(S.paused&&!S.solved&&!S.loading));
  document.getElementById('winCover').classList.toggle('hidden',!S.solved);

  const bad=conflictSet(), done=doneSet();
  const selV=(S.sel!==null)?S.board[S.sel]:0;
  for(let i=0;i<81;i++){
    const el=cells[i], v=S.board[i]||0;
    el.className='cell'
      +(colOf(i)%3===2?' br':'')+(rowOf(i)%3===2?' bb':'')
      +(colOf(i)===8?' edge-r':'')+(rowOf(i)===8?' edge-b':'');
    if(S.puzzle[i]) el.classList.add('given');
    if(S.revealed.includes(i)) el.classList.add('hint');
    if(bad.has(i)) el.classList.add('bad');
    if(done.has(i)) el.classList.add('done');
    if(S.sel!==null){
      const peer=rowOf(S.sel)===rowOf(i)||colOf(S.sel)===colOf(i)||boxOf(S.sel)===boxOf(i);
      if(peer&&!done.has(i)) el.classList.add('peer');
      if(selV&&v===selV) el.classList.add('samev');
      if(S.sel===i) el.classList.add('sel');
    }
    if(v){ el.textContent=v; }
    else if(S.notes[i]&&S.notes[i].length){
      el.innerHTML='<span class="notes">'+
        [1,2,3,4,5,6,7,8,9].map(n=>`<span>${S.notes[i].includes(n)?n:''}</span>`).join('')+
        '</span>';
    } else el.textContent='';
  }
  for(let n=1;n<=9;n++){
    const cnt=S.board.filter(x=>x===n).length;
    padEl.querySelector(`[data-n="${n}"]`).classList.toggle('used',cnt>=9);
  }
  renderRecords();
}
function renderRecords(){
  const rows=document.getElementById('recRows');
  rows.innerHTML='';
  let total=0;
  DIFFS.forEach(d=>{
    const s=stats[d.key]||{solved:0,best:null,worst:null};
    total+=s.solved;
    const div=document.createElement('div');
    div.className='recRow'+(d.key===S.diff?' cur':'');
    div.innerHTML=`<span>${d.label}</span><span>${s.solved}</span>`+
      `<span>${s.best===null?'–':fmt(s.best)}</span><span>${s.worst===null?'–':fmt(s.worst)}</span>`;
    rows.appendChild(div);
  });
  document.getElementById('totalSolved').textContent=total;
}

/* ---------------- timer ---------------- */
function tick(){
  if(S.loading||S.paused||S.solved) return;
  S.elapsed++;
  document.getElementById('clock').textContent=fmt(S.elapsed);
  if(S.elapsed%5===0) saveGame();
}
timerId=setInterval(tick,1000);

/* ---------------- events ---------------- */
document.getElementById('pause').addEventListener('click',()=>{
  if(S.solved||S.loading) return; S.paused=!S.paused; render();
});
document.getElementById('resume').addEventListener('click',()=>{ S.paused=false; render(); });
document.getElementById('again').addEventListener('click',()=>newGame(S.diff));
document.getElementById('newGame').addEventListener('click',()=>newGame(S.diff));
document.getElementById('hintBtn').addEventListener('click',hint);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('eraseBtn').addEventListener('click',()=>place(0));
document.getElementById('noteBtn').addEventListener('click',()=>{
  S.noteMode=!S.noteMode;
  document.getElementById('status').textContent=S.noteMode?'메모 모드 — 숫자를 누르면 작게 적힙니다':'';
  render();
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('저장된 기록을 모두 지울까요? 되돌릴 수 없습니다.')){
    stats=emptyStats(); saveStats(); render();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='9') place(Number(e.key));
  else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0') place(0);
  else if(e.key==='h'||e.key==='H') hint();
  else if(e.key==='n'||e.key==='N') document.getElementById('noteBtn').click();
  else if(S.sel!==null&&e.key.indexOf('Arrow')===0){
    const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
    const t=S.sel+d; if(t>=0&&t<81){ S.sel=t; render(); }
  }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveGame(); });

/* ---------------- start ---------------- */
if(restoreGame()) render(); else newGame('easy');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
